<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #ff6b9d 100%);
            background-size: 400% 400%;
            animation: gradientShift 6s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hearts-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart-float {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 2rem;
            animation: float-up 6s ease-in infinite;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            letter-spacing: 2px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.05); }
            50% { transform: scale(1.1); }
            75% { transform: scale(1.05); }
        }

        .message {
            font-size: 1.5rem;
            color: white;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
            animation: fadeInScale 1s ease-out 0.3s backwards;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInScale 1s ease-out 0.6s backwards;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            color: white;
            min-width: 120px;
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.5);
        }

        .btn-yes:active {
            transform: scale(0.95);
        }

        .btn-no {
            background: linear-gradient(135deg, #c44569, #ff6b9d);
            color: white;
            min-width: 120px;
            position: relative;
        }

        .btn-no:hover {
            transform: translate(-30px, -30px);
        }

        .btn-no:active {
            transform: translate(20px, 20px);
        }

        /* Success Screen */
        .success-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        .success-screen.show {
            display: flex;
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .success-content {
            text-align: center;
            color: white;
            animation: popUp 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popUp {
            from {
                opacity: 0;
                transform: scale(0.3) rotateZ(-10deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotateZ(0deg);
            }
        }

        .success-text {
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b9d;
            pointer-events: none;
            z-index: 1001;
        }

        @media (max-width: 600px) {
            .main-text {
                font-size: 2.5rem;
                letter-spacing: 1px;
            }

            .message {
                font-size: 1.2rem;
            }

            .btn {
                padding: 12px 30px;
                font-size: 1rem;
            }

            .success-text {
                font-size: 3rem;
            }

            .buttons-container {
                gap: 15px;
            }
        }

        @media (max-width: 400px) {
            .main-text {
                font-size: 2rem;
            }

            .message {
                font-size: 1rem;
            }

            .btn {
                padding: 10px 25px;
                font-size: 0.9rem;
                min-width: 100px;
            }

            .container {
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-background" id="heartsBackground"></div>

    <div class="container">
        <div class="main-text">I LOVE YOU ❤️</div>
        <div class="message">Will you be mine? 🥺❤️</div>
        <div class="buttons-container">
            <button class="btn btn-yes" onclick="celebrateYes()">✅ YES ❤️</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveNoButton()" ontouchstart="moveNoButton()">❌ NO</button>
        </div>
    </div>

    <div class="success-screen" id="successScreen">
        <div class="success-content">
            <div class="success-text">I KNEW IT! ❤️🥰</div>
        </div>
    </div>

    <script>
        // Floating hearts animation
        function createFloatingHearts() {
            const container = document.getElementById('heartsBackground');
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '🌹'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-float';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (4 + Math.random() * 2) + 's';
                heart.style.fontSize = (1 + Math.random() * 2) + 'rem';
                container.appendChild(heart);

                setTimeout(() => heart.remove(), 8000);
            }, 300);
        }

        // Move NO button away from cursor/touch
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const randomX = (Math.random() - 0.5) * 200;
            const randomY = (Math.random() - 0.5) * 200;
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // YES button celebration
        function celebrateYes() {
            const successScreen = document.getElementById('successScreen');
            successScreen.classList.add('show');
            createConfetti();
        }

        // Confetti animation
        function createConfetti() {
            const confettiPieces = 50;
            
            for (let i = 0; i < confettiPieces; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = -10 + 'px';
                confetti.style.background = ['#ff6b9d', '#ff8fab', '#c44569', '#ffd1dc'][Math.floor(Math.random() * 4)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                document.body.appendChild(confetti);

                const duration = 2 + Math.random() * 1;
                const xMove = (Math.random() - 0.5) * 200;
                const yMove = window.innerHeight + 100;

                confetti.animate([
                    { 
                        transform: `translateY(0) translateX(0) rotate(0deg)`,
                        opacity: 1
                    },
                    { 
                        transform: `translateY(${yMove}px) translateX(${xMove}px) rotate(${Math.random() * 720}deg)`,
                        opacity: 0
                    }
                ], {
                    duration: duration * 1000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                });

                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }

        // Initialize
        createFloatingHearts();
    </script>
</body>
</html>
